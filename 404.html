<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FBF7F0">
<title>悦言 · 发现所爱，分享所悦</title>
<meta name="description" content="悦言，一个清新治愈的二次元兴趣门户。发现属于你的宝藏世界。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23DCEBF8'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='%235C87AB'%3E悦%3C/text%3E%3C/svg%3E">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --cream:#FBF7F0;--cream-2:#F6EFE6;--paper:#FFFDFA;
  --sky:#DCEBF8;--sky-2:#EAF4FD;--sky-deep:#8CBEE4;--sky-ink:#5C87AB;
  --lilac:#E8DEF7;--lilac-deep:#B39DE0;--lilac-ink:#8878B8;
  --rose:#FBE3E9;--rose-deep:#EBA9BC;
  --mint:#DCF0E8;--peach:#FCE5D8;
  --ink:#3F3A48;--ink-2:#77708A;--ink-3:#A79FB3;
  --line:rgba(120,105,150,.13);--line-2:rgba(120,105,150,.2);
  --card:#FFFFFF;
  --radius:22px;--radius-sm:14px;
  --shadow:0 6px 20px rgba(120,105,150,.07);
  --shadow-hover:0 14px 32px rgba(120,105,150,.13);
  --ease:cubic-bezier(.22,.61,.36,1);
}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;padding:0;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  color:var(--ink);background:var(--cream);
  font-size:15px;line-height:1.7;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(680px 420px at 12% -6%,rgba(220,235,248,.72),transparent 70%),
    radial-gradient(560px 380px at 92% 4%,rgba(232,222,247,.6),transparent 72%),
    radial-gradient(520px 340px at 50% 104%,rgba(251,227,233,.5),transparent 74%);
}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
img{max-width:100%;display:block}
input{font:inherit}
::selection{background:var(--sky);color:var(--ink)}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- 顶部 ---------- */
.site-header{
  position:sticky;top:0;z-index:60;
  background:rgba(251,247,240,.82);
  -webkit-backdrop-filter:blur(18px) saturate(1.25);
  backdrop-filter:blur(18px) saturate(1.25);
  border-bottom:1px solid var(--line);
}
.hd-in{display:flex;align-items:center;gap:16px;height:66px}
.brand{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.brand-mark{
  width:36px;height:36px;flex:0 0 36px;border-radius:12px;
  display:grid;place-items:center;color:#fff;font-size:17px;font-weight:700;
  background:linear-gradient(145deg,#A8CFEA,#B9A6E6);
  box-shadow:0 6px 14px rgba(140,190,228,.38);
}
.brand-txt{display:block;line-height:1.15}
.brand-txt b{display:block;font-size:18px;letter-spacing:.1em;font-weight:700}
.brand-txt i{display:block;font-style:normal;font-size:10.5px;letter-spacing:.16em;color:var(--ink-3);margin-top:2px}
.hd-search{
  margin-left:auto;display:flex;align-items:center;gap:6px;
  background:#fff;border:1px solid var(--line);border-radius:999px;
  padding:4px 4px 4px 15px;box-shadow:var(--shadow);transition:border-color .2s var(--ease);
}
.hd-search:focus-within{border-color:var(--sky-deep)}
.hd-search input{
  border:0;outline:0;background:transparent;width:158px;
  font-size:13px;color:var(--ink);padding:6px 0;
}
.hd-search input::placeholder{color:var(--ink-3)}
.hd-search button{
  border:0;cursor:pointer;border-radius:999px;padding:7px 15px;
  background:var(--sky-deep);color:#fff;font-size:12.5px;letter-spacing:.04em;
  transition:background .2s var(--ease);
}
.hd-search button:hover{background:#7FB0D9}
.hd-nav{display:flex;align-items:center;gap:20px;font-size:13px;color:var(--ink-2)}
.hd-nav a{position:relative;padding:4px 0;transition:color .2s var(--ease)}
.hd-nav a:hover{color:var(--sky-ink)}
.hd-nav a::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:2px;border-radius:2px;
  background:var(--sky-deep);transform:scaleX(0);transition:transform .24s var(--ease);
}
.hd-nav a:hover::after{transform:scaleX(1)}
.hd-mini{display:none;margin-left:auto;gap:8px;overflow-x:auto;scrollbar-width:none}
.hd-mini::-webkit-scrollbar{display:none}
.hd-mini a{
  flex:0 0 auto;font-size:12.5px;color:var(--ink-2);
  padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;
}
.hd-mini a.is-on{background:var(--sky);border-color:transparent;color:var(--sky-ink)}

/* ---------- 主视觉 ---------- */
.hero{margin:26px 0 6px}
.hero-in{
  position:relative;overflow:hidden;isolation:isolate;
  border-radius:32px;border:1px solid rgba(255,255,255,.7);
  background:linear-gradient(158deg,#F5FAFE 0%,#FDF9F4 52%,#FBF2F4 100%);
  box-shadow:0 18px 44px rgba(140,160,190,.13);
  padding:46px 44px;display:grid;grid-template-columns:1.02fr .98fr;gap:28px;align-items:center;
}
.hero-in::after{
  content:"";position:absolute;inset:auto -60px -120px auto;width:320px;height:320px;border-radius:50%;
  background:radial-gradient(circle,rgba(232,222,247,.55),transparent 68%);z-index:-1;
}
.hero-kicker{
  display:inline-flex;align-items:center;gap:8px;margin:0 0 14px;
  font-size:11.5px;letter-spacing:.2em;color:var(--sky-ink);
  background:rgba(255,255,255,.72);border:1px solid rgba(140,190,228,.35);
  padding:5px 12px;border-radius:999px;
}
.hero-kicker::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--sky-deep)}
.hero h1{
  margin:0 0 14px;font-size:clamp(27px,3.9vw,44px);line-height:1.28;
  letter-spacing:.03em;font-weight:700;
  background:linear-gradient(96deg,#4C7FA6 0%,#6E7FB8 46%,#A98BC9 100%);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:var(--sky-ink);
}
.hero-sub{margin:0 0 26px;font-size:13.5px;color:var(--ink-2);letter-spacing:.1em}
.hero-acts{display:flex;flex-wrap:wrap;gap:12px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border-radius:999px;padding:11px 24px;font-size:13.5px;letter-spacing:.05em;
  border:1px solid var(--line-2);background:#fff;color:var(--ink);
  cursor:pointer;transition:transform .22s var(--ease),box-shadow .22s var(--ease),background .22s var(--ease);
  box-shadow:0 4px 12px rgba(120,105,150,.06);
}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(120,105,150,.13)}
.btn-primary{
  border-color:transparent;color:#fff;
  background:linear-gradient(120deg,#8CBEE4,#A99AE0);
  box-shadow:0 8px 20px rgba(140,160,220,.32);
}
.btn-primary:hover{box-shadow:0 14px 28px rgba(140,160,220,.4)}
.btn-ghost{background:rgba(255,255,255,.78)}
.hero-art{position:relative;display:flex;justify-content:center;align-items:center}
.hero-art svg{width:100%;max-width:400px;height:auto;filter:drop-shadow(0 12px 26px rgba(150,170,200,.16))}

/* ---------- 区块通用 ---------- */
.section{margin:46px 0}
.sec-head{display:flex;align-items:baseline;flex-wrap:wrap;gap:10px;margin-bottom:18px}
.sec-head h2{margin:0;font-size:20px;letter-spacing:.08em;font-weight:700}
.sec-head p{margin:0;font-size:12.5px;color:var(--ink-3)}
.sec-head .dot{width:7px;height:7px;border-radius:50%;background:var(--lilac-deep);display:inline-block;margin-right:2px}

/* ---------- 分类探索 ---------- */
.cats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.cat-card{
  display:flex;flex-direction:column;gap:5px;
  padding:16px 15px 15px;border-radius:18px;
  background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);
  transition:transform .24s var(--ease),box-shadow .24s var(--ease),border-color .24s var(--ease);
  min-height:104px;
}
.cat-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover);border-color:rgba(140,190,228,.5)}
.cat-ico{font-size:19px;line-height:1.2}
.cat-name{font-size:14px;font-weight:600;letter-spacing:.04em}
.cat-desc{font-size:11.5px;line-height:1.55;color:var(--ink-3);margin-top:auto}
.cat-card.is-on{border-color:var(--sky-deep);background:linear-gradient(165deg,#F7FBFF,#FDFEFF)}
.cat-card.is-on .cat-name{color:var(--sky-ink)}
.cat-all{
  align-items:center;justify-content:center;text-align:center;
  background:linear-gradient(155deg,#F6FAFE,#FBF7F2);
}
.cat-all .cat-name{font-size:14px}
.cat-all .cat-desc{margin-top:0}

/* ---------- 推荐区 ---------- */
.rec-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.empty-card{
  grid-column:1 / -1;
  border:1px dashed rgba(140,150,190,.32);border-radius:18px;
  padding:28px 22px;text-align:center;
  background:linear-gradient(180deg,rgba(255,253,250,.9),rgba(250,246,241,.75));
}
.empty-card b{display:block;font-size:14px;font-weight:600;letter-spacing:.05em;margin-bottom:6px}
.empty-card span{font-size:12.5px;color:var(--ink-3);letter-spacing:.03em}

/* ---------- 卡片 ---------- */
.cards{display:grid;grid-template-columns:1fr;gap:16px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;box-shadow:var(--shadow);
  transition:transform .26s var(--ease),box-shadow .26s var(--ease);
}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow-hover)}
.card > a{display:flex;flex-direction:column;height:100%}
.cover{
  aspect-ratio:16/10;display:grid;place-items:center;position:relative;overflow:hidden;
}
.cover::after{
  content:"";position:absolute;inset:0;
  background:radial-gradient(120px 90px at 24% 22%,rgba(255,255,255,.55),transparent 70%);
}
.cover[data-tone="sky"]{background:linear-gradient(150deg,#EAF4FD,#D3E6F8)}
.cover[data-tone="mint"]{background:linear-gradient(150deg,#E9F7F1,#CFEBE0)}
.cover[data-tone="peach"]{background:linear-gradient(150deg,#FDEFE6,#F8DBCB)}
.cover[data-tone="lilac"]{background:linear-gradient(150deg,#F0EAFB,#DCCEF4)}
.cover[data-tone="rose"]{background:linear-gradient(150deg,#FDEFF3,#F8DCE4)}
.cover[data-tone="grey"]{background:linear-gradient(150deg,#F3F1F5,#E4E1EA)}
.cover-glyph{
  position:relative;z-index:1;font-size:30px;font-weight:700;
  color:rgba(255,255,255,.92);text-shadow:0 2px 10px rgba(110,110,150,.16);letter-spacing:.08em;
}
.card-body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.card-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{
  font-size:11px;letter-spacing:.06em;padding:3px 10px;border-radius:999px;
  background:var(--sky-2);color:var(--sky-ink);border:1px solid rgba(140,190,228,.28);
}
.pin{
  font-size:11px;letter-spacing:.06em;padding:3px 9px;border-radius:999px;
  background:var(--rose);color:#B4707F;border:1px solid rgba(235,169,188,.4);
}
.card-title{margin:0;font-size:15.5px;line-height:1.5;font-weight:600;letter-spacing:.02em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-sum{margin:0;font-size:12.5px;line-height:1.7;color:var(--ink-2);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-foot{
  margin-top:auto;padding-top:10px;display:flex;align-items:center;justify-content:space-between;
  font-size:11.5px;color:var(--ink-3);border-top:1px solid rgba(120,105,150,.09)
}
.card-foot .go{color:var(--sky-ink);letter-spacing:.04em}
.list-meta{font-size:12px;color:var(--ink-3);margin-left:auto}

/* 骨架屏 */
.sk-card{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:#fff}
.sk-cover{aspect-ratio:16/10}
.sk-body{padding:16px 18px 20px;display:flex;flex-direction:column;gap:9px}
.sk-line{height:10px;border-radius:6px}
.sk-line.w40{width:40%}.sk-line.w70{width:70%}
.skel{background:linear-gradient(90deg,#F2EEF6 25%,#FAF7FC 37%,#F2EEF6 63%);background-size:400% 100%;animation:sheen 1.4s ease infinite}
@keyframes sheen{0%{background-position:100% 0}100%{background-position:0 0}}

/* 状态块 */
.state{text-align:center;padding:44px 20px;border:1px dashed rgba(140,150,190,.3);border-radius:20px;background:rgba(255,253,250,.7)}
.state .emo{font-size:26px;margin-bottom:8px}
.state h3{margin:0 0 6px;font-size:15px;font-weight:600;letter-spacing:.04em}
.state p{margin:0 0 16px;font-size:12.5px;color:var(--ink-3)}
.state .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* 分页 */
.pager{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:26px;flex-wrap:wrap}
.pager .pg{
  min-width:34px;padding:7px 11px;border-radius:10px;background:#fff;
  border:1px solid var(--line);font-size:12.5px;color:var(--ink-2);
  transition:all .2s var(--ease);
}
.pager .pg:hover{border-color:var(--sky-deep);color:var(--sky-ink)}
.pager .pg.is-now{background:var(--sky-deep);border-color:transparent;color:#fff}
.pager .pg.is-off{opacity:.4;pointer-events:none}
.pager .gap{color:var(--ink-3);font-size:12px;padding:0 2px}

/* ---------- 详情 ---------- */
.view[hidden]{display:none}
.detail-card{
  position:relative;background:var(--paper);border:1px solid var(--line);
  border-radius:26px;padding:34px 34px 30px;margin:26px 0 10px;
  box-shadow:var(--shadow);overflow:hidden;
}
.detail-card::before{
  content:"";position:absolute;left:0;right:0;top:0;height:5px;
  background:linear-gradient(90deg,#A8CFEA,#C0B0E8,#F4C3CF);
}
.detail-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.detail-title{margin:0 0 10px;font-size:clamp(21px,3.2vw,29px);line-height:1.45;letter-spacing:.02em}
.detail-meta{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-3);margin-bottom:18px}
.detail-summary{
  margin:0 0 20px;padding:14px 18px;border-radius:14px;
  background:linear-gradient(140deg,#F6FAFE,#FCF8F3);border:1px solid rgba(140,190,228,.22);
  font-size:13.5px;color:var(--ink-2);line-height:1.8;
}
.detail-body{font-size:15px;line-height:2;color:var(--ink);word-break:break-word;white-space:pre-wrap}
.detail-body.empty{color:var(--ink-3);font-size:13.5px;background:rgba(246,242,248,.6);padding:20px;border-radius:14px}
.detail-foot{
  margin-top:28px;padding-top:16px;border-top:1px solid rgba(120,105,150,.1);
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  font-size:11.5px;color:var(--ink-3);letter-spacing:.06em;
}
.detail-skel{display:flex;flex-direction:column;gap:12px}
.sk-title{height:24px;width:58%;border-radius:8px}
.sk-block{height:150px;border-radius:14px}
.back-bar{margin:14px 0 0}

/* ---------- 页脚 ---------- */
.site-footer{
  margin:56px 0 0;padding:30px 0 34px;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--ink-3);letter-spacing:.06em;
}
.foot-in{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.foot-note{margin:0 0 4px}
.foot-copy{margin:0;font-size:11px;color:var(--ink-3);opacity:.8}

/* ---------- 移动底栏 ---------- */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:70;display:flex;
  background:rgba(251,247,240,.92);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  border-top:1px solid var(--line);
  padding:7px 8px calc(7px + env(safe-area-inset-bottom));
}
.tabbar button{
  flex:1;border:0;background:transparent;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:10.5px;color:var(--ink-3);padding:5px 0;border-radius:12px;
  transition:color .2s var(--ease)
}
.tabbar button .ti{font-size:16px;line-height:1}
.tabbar button.is-on{color:var(--sky-ink)}

/* ---------- 响应式 ---------- */
@media (min-width:600px){
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (min-width:900px){
  .cards{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:900px){
  .hero-in{grid-template-columns:1fr;padding:36px 26px;text-align:left}
  .hero-art{order:-1}
  .hero-art svg{max-width:280px}
  .cats{grid-template-columns:repeat(3,minmax(0,1fr))}
  .rec-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .detail-card{padding:26px 22px}
}
@media (max-width:760px){
  .hd-search{display:none}
  .hd-nav{display:none}
  .hd-mini{display:flex}
  .wrap{padding:0 16px}
  .hero-in{border-radius:24px;padding:28px 20px}
  .hero h1{font-size:clamp(23px,6.4vw,30px)}
  .section{margin:34px 0}
  body{padding-bottom:calc(58px + env(safe-area-inset-bottom))}
}
@media (max-width:560px){
  .cats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cat-card{min-height:92px;padding:13px 12px}
  .rec-grid{grid-template-columns:1fr}
  .sec-head h2{font-size:18px}
  .detail-card{border-radius:20px;padding:22px 16px}
  .brand-txt i{display:none}
}
@media (min-width:760px){
  .tabbar{display:none}
  body{padding-bottom:0}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;transition-duration:.001ms !important}
}
</style>
</head>
<body>

<header class="site-header">
  <div class="hd-in wrap">
    <a class="brand" href="/" data-link>
      <span class="brand-mark">悦</span>
      <span class="brand-txt"><b>悦言</b><i>发现所爱 · 分享所悦</i></span>
    </a>

    <form class="hd-search" id="hdSearch" role="search">
      <input id="hdInput" type="search" placeholder="搜索内容、工具、教程…" aria-label="搜索" autocomplete="off">
      <button type="submit">搜索</button>
    </form>

    <nav class="hd-nav" aria-label="主导航">
      <a href="/" data-link>首页</a>
      <a href="#explore">分类</a>
      <a href="#discover">发现</a>
      <a href="#latest">最新</a>
    </nav>

    <nav class="hd-mini" aria-label="移动导航">
      <a href="/" data-link class="is-on">首页</a>
      <a href="#explore">分类</a>
      <a href="#discover">发现</a>
      <a href="#latest">最新</a>
    </nav>
  </div>
</header>

<main class="wrap">

  <!-- 主视觉 -->
  <section class="hero" id="top">
    <div class="hero-in">
      <div class="hero-copy">
        <p class="hero-kicker">YUEYAN · 二次元兴趣门户</p>
        <h1>发现属于你的宝藏世界</h1>
        <p class="hero-sub">实用工具 · 趣味发现 · 精选分享</p>
        <div class="hero-acts">
          <a class="btn btn-primary" href="#explore">开始探索</a>
          <a class="btn btn-ghost" href="#latest">最新内容</a>
        </div>
      </div>
      <div class="hero-art" aria-hidden="true">
        <svg viewBox="0 0 420 320" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#EAF4FD"/><stop offset="1" stop-color="#FDF9F4"/>
            </linearGradient>
            <linearGradient id="hillG" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#DCEBF8"/><stop offset="1" stop-color="#C9DFF2"/>
            </linearGradient>
            <linearGradient id="hairG" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#C9B6E8"/><stop offset="1" stop-color="#A88FD6"/>
            </linearGradient>
            <linearGradient id="dressG" x1="0" y1="0" x2="0" y2="1">

<script>
(function(){
  'use strict';

  var PAGE_SIZE = 12;
  var DATA_URL = '/data.json';
  var TONE = { '文章':'sky', '实用工具':'mint', '资源分享':'peach', '教程指南':'lilac', '其他':'rose' };
  var CAT_META = {
    '文章':     { icon:'📝', desc:'记录值得分享的内容' },
    '实用工具': { icon:'🧰', desc:'顺手好用的小东西' },
    '资源分享': { icon:'🎁', desc:'收藏夹里翻出来的' },
    '教程指南': { icon:'📚', desc:'一步一步慢慢来' },
    '其他':     { icon:'✨', desc:'还没归类的先放这' }
  };
  var FALLBACK_CATS = ['文章','实用工具','资源分享','教程指南','其他'];

  var state = { cats: null, catsFailed: false, reqId: 0, homeItems: [], db: null };

  function $(s, r){ return (r || document).querySelector(s); }
  function el(tag, cls, text){
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = text;
    return n;
  }
  function clear(node){ while (node && node.firstChild) node.removeChild(node.firstChild); }

  function fmtDate(v){
    if (!v) return '';
    var s = String(v).slice(0, 10);
    var m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (!m) return s;
    return m[1] + '.' + m[2] + '.' + m[3];
  }
  function glyphOf(cat){ return cat ? String(cat).slice(0, 1) : '悦'; }
  function toneOf(cat){ return TONE[cat] || 'grey'; }

  /* ---------- 数据层：全部读静态 data.json ---------- */
  function loadDb(){
    if (state.db) return Promise.resolve(state.db);
    return fetch(DATA_URL, { cache: 'no-store' }).then(function(r){
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function(d){
      state.db = d || {};
      return state.db;
    });
  }

  function normalize(it, i){
    var o = it && typeof it === 'object' ? it : {};
    return {
      id: (o.id != null ? String(o.id) : String(i + 1)),
      title: o.title || '',
      summary: o.summary || '',
      content: o.content != null ? String(o.content) : '',
      category: o.category ? String(o.category) : '',
      created_at: o.created_at || o.createdAt || '',
      updated_at: o.updated_at || o.updatedAt || '',
      is_pinned: o.is_pinned === true || o.is_pinned === 1 ? 1 : 0
    };
  }

  function sortItems(list){
    return list.slice().sort(function(a, b){
      if (b.is_pinned !== a.is_pinned) return b.is_pinned - a.is_pinned;
      return String(b.created_at).localeCompare(String(a.created_at));
    });
  }

  function api(path){
    return loadDb().then(function(db){
      var contents = Array.isArray(db.contents) ? db.contents.map(normalize) : [];
      contents = sortItems(contents);

      var mDetail = path.match(/^\/api\/contents\/([^?]+)/);
      if (mDetail) {
        var key = decodeURIComponent(mDetail[1]);
        var found = null;
        for (var i = 0; i < contents.length; i++) {
          if (contents[i].id === key) { found = contents[i]; break; }
        }
        if (!found) return { ok: false, status: 404 };
        return { ok: true, status: 200, data: { item: found } };
      }

      if (/^\/api\/categories/.test(path)) {
        var cats = Array.isArray(db.categories) ? db.categories : [];
        return { ok: true, status: 200, data: { items: cats } };
      }

      if (/^\/api\/contents/.test(path)) {
        var qs = {};
        var qi = path.indexOf('?');
        if (qi > -1) {
          path.slice(qi + 1).split('&').forEach(function(kv){
            if (!kv) return;
            var p = kv.split('=');
            qs[decodeURIComponent(p[0])] = decodeURIComponent(p[1] || '');
          });
        }
        var page = Math.max(1, parseInt(qs.page, 10) || 1);
        var size = Math.max(1, parseInt(qs.page_size, 10) || PAGE_SIZE);
        var cat = qs.category || '';
        var filtered = cat ? contents.filter(function(x){ return x.category === cat; }) : contents;
        var slice = filtered.slice((page - 1) * size, page * size);
        return { ok: true, status: 200, data: { items: slice, total: filtered.length, page: page, page_size: size } };
      }

      return { ok: false, status: 404 };
    }).catch(function(e){
      return { ok: false, status: 0, error: e };
    });
  }

  /* ---------- 路由 ---------- */
  function parseRoute(){
    var path = location.pathname.replace(/\/+$/, '') || '/';
    var sp = new URLSearchParams(location.search);
    var page = Math.max(1, parseInt(sp.get('page') || '1', 10) || 1);
    var q = sp.get('q') || '';

    var m = path.match(/^\/content\/(\d+)$/);
    if (m) return { view: 'detail', id: m[1] };

    var c = path.match(/^\/category\/(.+)$/);
    if (c) {
      var name;
      try { name = decodeURIComponent(c[1]); } catch (e) { name = c[1]; }
      return { view: 'home', category: name, page: page, q: q };
    }
    return { view: 'home', category: '', page: page, q: q };
  }

  function hrefWithPage(p){
    var r = parseRoute();
    var qs = [];
    if (r.category) qs.push('page=' + p); else qs.push('page=' + p);
    if (r.q) qs.push('q=' + encodeURIComponent(r.q));
    var base = r.category ? ('/category/' + encodeURIComponent(r.category)) : '/';
    return base + (qs.length ? '?' + qs.join('&') : '');
  }

  function navigate(to, replace){
    if (replace) history.replaceState({}, '', to);
    else history.pushState({}, '', to);
    render();
    window.scrollTo({ top: 0, behavior: 'auto' });
  }

  /* ---------- 分类 ---------- */
  function ensureCats(){
    if (state.cats) return Promise.resolve(state.cats);
    return loadDb().then(function(db){
      var raw = Array.isArray(db.categories) ? db.categories : [];
      var names = raw.map(function(c){ return c && c.name ? String(c.name) : ''; }).filter(Boolean);
      if (!names.length) {
        var cs = Array.isArray(db.contents) ? db.contents : [];
        names = cs.map(function(c){ return c && c.category ? String(c.category) : ''; }).filter(Boolean);
      }
      if (!names.length) { names = FALLBACK_CATS.slice(); state.catsFailed = true; }
      state.cats = names;
      return names;
    }).catch(function(){
      state.catsFailed = true;
      state.cats = FALLBACK_CATS.slice();
      return state.cats;
    });
  }

  function renderCatNav(active){
    var box = $('#catNav');
    clear(box);

    var all = el('a', 'cat-card cat-all' + (!active ? ' is-on' : ''));
    all.setAttribute('href', '/');
    all.setAttribute('data-link', '');
    all.appendChild(el('span', 'cat-ico', '🌿'));
    all.appendChild(el('span', 'cat-name', '全部'));
    all.appendChild(el('span', 'cat-desc', '什么都看看'));
    box.appendChild(all);

    (state.cats || []).forEach(function(name){
      var meta = CAT_META[name] || { icon: '🔖', desc: '还有更多' };
      var a = el('a', 'cat-card' + (active === name ? ' is-on' : ''));
      a.setAttribute('href', '/category/' + encodeURIComponent(name));
      a.setAttribute('data-link', '');
      a.appendChild(el('span', 'cat-ico', meta.icon));
      a.appendChild(el('span', 'cat-name', name));
      a.appendChild(el('span', 'cat-desc', meta.desc));
      box.appendChild(a);
    });
  }

  /* ---------- 卡片 ---------- */
  function cardEl(item){
    var cat = item.category || '';
    var a = el('a');
    a.setAttribute('href', '/content/' + encodeURIComponent(item.id));
    a.setAttribute('data-link', '');

    var cover = el('div', 'cover');
    cover.setAttribute('data-tone', toneOf(cat));
    cover.appendChild(el('span', 'cover-glyph', glyphOf(cat)));
    a.appendChild(cover);

    var body = el('div', 'card-body');
    var top = el('div', 'card-top');
    if (cat) top.appendChild(el('span', 'chip', cat));
    if (item.is_pinned) top.appendChild(el('span', 'pin', '置顶'));
    body.appendChild(top);

    body.appendChild(el('h3', 'card-title', item.title || '无标题'));
    body.appendChild(el('p', 'card-sum', item.summary || '（这条还没有摘要）'));

    var foot = el('div', 'card-foot');
    foot.appendChild(el('time', '', fmtDate(item.created_at) || '未标注时间'));
    foot.appendChild(el('span', 'go', '阅读 →'));
    body.appendChild(foot);

    a.appendChild(body);
    var wrapCard = el('article', 'card');
    wrapCard.appendChild(a);
    return wrapCard;
  }

  function renderCards(items, host){
    var box = host || $('#cards');
    clear(box);
    items.forEach(function(it){ box.appendChild(cardEl(it)); });
  }

  /* ---------- 推荐区 ---------- */
  function fillRec(sel, items, emptyTitle, emptyNote){
    var host = $(sel);
    clear(host);
    if (!items || !items.length) {
      var e = el('div', 'empty-card');
      e.appendChild(el('b', '', emptyTitle));
      e.appendChild(el('span', '', emptyNote));
      host.appendChild(e);
      return;
    }
    items.forEach(function(it){ host.appendChild(cardEl(it)); });
  }

  function renderDiscover(items){
    var all = items || [];
    var today = all.slice(0, 3);
    var fav = all.filter(function(x){ return x.is_pinned; }).slice(0, 3);
    fillRec('#todayGrid', today, '新的发现正在路上，敬请期待。', '这里会放上今天最值得一看的东西');
    fillRec('#favGrid', fav, '值得收藏的东西还在挑，敬请期待。', '等有了值得回头的，就放进这里');
  }

  /* ---------- 状态块 ---------- */
  function showState(kind, extra){
    var host = $('#listState');
    clear(host);

    if (kind === 'loading') { host.appendChild(buildSkeleton()); return; }
    if (!kind) return;

    var box = el('div', 'state');
    var emo = el('div', 'emo');
    var h3 = el('h3');
    var p = el('p');
    var acts = el('div', 'acts');

    if (kind === 'empty') {
      emo.textContent = '🌙';
      h3.textContent = '这里还空着';
      p.textContent = '新的内容正在路上，过阵子再来看看。';
      var b1 = el('button', 'btn btn-primary', '刷新看看');
      b1.type = 'button';
      b1.addEventListener('click', function(){ state.db = null; render(); });
      acts.appendChild(b1);
    } else if (kind === 'empty-page') {
      emo.textContent = '🍃';
      h3.textContent = '这一页没有内容';
      p.textContent = '页码可能翻过头了，回第一页看看吧。';
      var b2 = el('a', 'btn btn-primary', '回第一页');
      b2.setAttribute('href', hrefWithPage(1));
      b2.setAttribute('data-link', '');
      acts.appendChild(b2);
    } else if (kind === 'noresult') {
      emo.textContent = '🔍';
      h3.textContent = '没找到相符的内容';
      p.textContent = '换个词试试，或者从分类里逛逛。';
      var b3 = el('a', 'btn', '看全部内容');
      b3.setAttribute('href', '/');
      b3.setAttribute('data-link', '');
      acts.appendChild(b3);
    } else if (kind === 'error') {
      emo.textContent = '☁️';
      h3.textContent = '内容没能加载出来';
      p.textContent = extra === 404 ? '数据没有回应（404）。' : (extra ? '网络或数据出了点状况（' + extra + '）。' : '网络好像断了，检查一下连接。');
      var b4 = el('button', 'btn btn-primary', '再试一次');
      b4.type = 'button';
      b4.addEventListener('click', function(){ state.db = null; render(); });
      acts.appendChild(b4);
    }
    box.appendChild(emo);
    box.appendChild(h3);
    box.appendChild(p);
    box.appendChild(acts);
    host.appendChild(box);
  }

  function clearState(){ clear($('#listState')); }

  function buildSkeleton(){
    var grid = el('div', 'cards');
    for (var i = 0; i < 3; i++) {
      var c = el('div', 'sk-card');
      c.appendChild(el('div', 'sk-cover skel'));
      var b = el('div', 'sk-body');
      b.appendChild(el('div', 'sk-line w40 skel'));
      b.appendChild(el('div', 'sk-line skel'));
      b.appendChild(el('div', 'sk-line w70 skel'));
      c.appendChild(b);
      grid.appendChild(c);
    }
    return grid;
  }

  /* ---------- 分页 ---------- */
  function renderPager(info){
    var host = $('#pager');
    clear(host);
    var total = Number(info && info.total) || 0;
    var pageSize = Number(info && info.page_size) || PAGE_SIZE;
    var page = Number(info && info.page) || 1;
    var pages = Math.max(1, Math.ceil(total / pageSize));
    if (pages <= 1) return;

    function mk(label, target, cls){
      var a = el('a', 'pg' + (cls ? ' ' + cls : ''), label);
      a.setAttribute('href', hrefWithPage(target));
      a.setAttribute('data-link', '');
      return a;
    }

    host.appendChild(page > 1 ? mk('上一页', page - 1) : mk('上一页', page, 'is-off'));

    var list = [];
    if (pages <= 7) {
      for (var i = 1; i <= pages; i++) list.push(i);
    } else {
      list = [1];
      if (page > 3) list.push('…');
      for (var j = Math.max(2, page - 1); j <= Math.min(pages - 1, page + 1); j++) list.push(j);
      if (page < pages - 2) list.push('…');
      list.push(pages);
    }
    list.forEach(function(n){
      if (n === '…') { host.appendChild(el('span', 'gap', '…')); return; }
      host.appendChild(mk(String(n), n, n === page ? 'is-now' : ''));
    });

    host.appendChild(page < pages ? mk('下一页', page + 1) : mk('下一页', page, 'is-off'));
  }

  /* ---------- 列表 ---------- */
  function listUrl(page, category){
    var u = '/api/contents?page=' + page + '&page_size=' + PAGE_SIZE;
    if (category) u += '&category=' + encodeURIComponent(category);
    return u;
  }

  function loadList(route){
    var id = ++state.reqId;
    clear($('#cards'));
    clear($('#pager'));
    showState('loading');

    return api(listUrl(route.page, route.category)).then(function(res){
      if (id !== state.reqId) return;
      if (!res.ok) { showState('error', res.status); $('#listMeta').textContent = ''; return; }
      var d = res.data || {};
      var items = Array.isArray(d.items) ? d.items : [];
      var total = Number(d.total) || 0;
      state.homeItems = items;
      $('#listMeta').textContent = total ? '共 ' + total + ' 条' : '';
      if (!items.length) {
        showState(route.page > 1 ? 'empty-page' : 'empty');
        return;
      }
      clearState();
      renderCards(items);
      renderPager({ total: total, page: Number(d.page) || route.page, page_size: Number(d.page_size) || PAGE_SIZE });
    });
  }

  function fetchAllForSearch(){
    return loadDb().then(function(db){
      var cs = Array.isArray(db.contents) ? db.contents.map(normalize) : [];
      return { ok: true, status: 200, items: sortItems(cs) };
    }).catch(function(){
      return { ok: false, status: 0, items: [] };
    });
  }

  function runSearch(route){
    var id = ++state.reqId;
    clear($('#cards'));
    clear($('#pager'));
    showState('loading');

    return fetchAllForSearch().then(function(res){
      if (id !== state.reqId) return;
      if (!res.ok) { showState('error', res.status); return; }
      var pool = route.category ? res.items.filter(function(x){ return x.category === route.category; }) : res.items;
      var kw = route.q.toLowerCase();
      var hit = pool.filter(function(it){
        var text = (it.title || '') + ' ' + (it.summary || '') + ' ' + (it.content || '');
        return text.toLowerCase().indexOf(kw) !== -1;
      });
      $('#listMeta').textContent = hit.length ? '找到 ' + hit.length + ' 条' : '';
      if (!hit.length) { showState('noresult'); return; }
      clearState();
      var pages = Math.max(1, Math.ceil(hit.length / PAGE_SIZE));
      var page = Math.min(route.page, pages);
      var slice = hit.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE);
      renderCards(slice);
      renderPager({ total: hit.length, page: page, page_size: PAGE_SIZE });
    });
  }

  /* ---------- 首页 ---------- */
  function syncSearchInputs(q){
    var a = $('#hdInput');
    if (a && a.value !== q) a.value = q;
  }
  function syncTab(which){
    var nodes = document.querySelectorAll('.tabbar [data-act]');
    for (var i = 0; i < nodes.length; i++) {
      var n = nodes[i];
      var key = n.getAttribute('data-tab') || ('act:' + n.getAttribute('data-act'));
      n.classList.toggle('is-on', key === which);
    }
  }

  function showHome(route){
    $('#viewHome').hidden = false;
    $('#viewDetail').hidden = true;
    syncSearchInputs(route.q);

    var filtered = !!(route.q || route.category);
    var disc = $('#discover');
    var coll = $('#collect');
    if (disc) disc.hidden = filtered;
    if (coll) coll.hidden = filtered;

    return ensureCats().then(function(){
      renderCatNav(route.category);

      var title;
      if (route.q) title = '搜索：' + route.q;
      else if (route.category) title = route.category;
      else title = '最近更新';
      $('#listTitle').textContent = title;
      document.title = route.q ? (route.q + ' · 悦言') : (route.category ? (route.category + ' · 悦言') : '悦言 · 发现所爱，分享所悦');

      syncTab(route.q ? 'act:search' : 'home');

      if (route.q) return runSearch(route);
      return loadList(route).then(function(){
        if (!filtered) renderDiscover(state.homeItems);
      });
    });
  }

  /* ---------- 详情 ---------- */
  function detailSkeleton(){
    var box = el('div', 'detail-skel');
    box.appendChild(el('div', 'sk-title skel'));
    box.appendChild(el('div', 'sk-line w40 skel'));
    box.appendChild(el('div', 'sk-block skel'));
    box.appendChild(el('div', 'sk-line skel'));
    box.appendChild(el('div', 'sk-line w70 skel'));
    return box;
  }

  function showDetail(id){
    $('#viewHome').hidden = true;
    $('#viewDetail').hidden = false;
    syncTab('');
    var box = $('#detailBody');
    clear(box);
    box.appendChild(detailSkeleton());

    return api('/api/contents/' + id).then(function(res){
      clear(box);

      if (!res.ok && res.status === 404) {
        document.title = '内容不存在 · 悦言';
        box.appendChild(el('h1', 'detail-title', '这条内容不在了'));
        var s404 = el('div', 'state');
        s404.appendChild(el('div', 'emo', '🍂'));
        s404.appendChild(el('h3', '', '可能还没发布，或者链接写错了'));
        s404.appendChild(el('p', '', '换个地方逛逛吧，首页里还有别的东西。'));
        var a404 = el('div', 'acts');
        var back404 = el('a', 'btn btn-primary', '回到首页');
        back404.setAttribute('href', '/');
        back404.setAttribute('data-link', '');
        a404.appendChild(back404);
        s404.appendChild(a404);
        box.appendChild(s404);
        return;
      }

      if (!res.ok) {
        document.title = '加载失败 · 悦言';
        box.appendChild(el('h1', 'detail-title', '内容没能加载出来'));
        var st = el('div', 'state');
        st.appendChild(el('div', 'emo', '☁️'));
        st.appendChild(el('h3', '', '网络或数据出了点状况'));
        st.appendChild(el('p', '', res.status ? ('错误码 ' + res.status) : '网络好像断了。'));
        var acts = el('div', 'acts');
        var b2 = el('button', 'btn btn-primary', '再试一次');
        b2.type = 'button';
        b2.addEventListener('click', function(){ showDetail(id); });
        acts.appendChild(b2);
        var b3 = el('a', 'btn', '回首页');
        b3.setAttribute('href', '/');
        b3.setAttribute('data-link', '');
        acts.appendChild(b3);
        st.appendChild(acts);
        box.appendChild(st);
        return;
      }

      var d = res.data || {};
      var it = (d.item && typeof d.item === 'object') ? d.item : d;
      var cat = it.category ? String(it.category) : '';

      document.title = (it.title || '内容') + ' · 悦言';

      var top = el('div', 'detail-top');
      if (cat) top.appendChild(el('span', 'chip', cat));
      if (it.is_pinned) top.appendChild(el('span', 'pin', '置顶'));
      box.appendChild(top);

      box.appendChild(el('h1', 'detail-title', it.title || '无标题'));

      var meta = el('div', 'detail-meta');
      meta.appendChild(el('span', '', '发布于 ' + (fmtDate(it.created_at) || '未标注')));
      if (it.updated_at && fmtDate(it.updated_at) !== fmtDate(it.created_at)) {
        meta.appendChild(el('span', '', '更新于 ' + fmtDate(it.updated_at)));
      }
      box.appendChild(meta);

      if (it.summary) box.appendChild(el('p', 'detail-summary', it.summary));

      var content = it.content != null ? String(it.content) : '';
      if (content.trim()) box.appendChild(el('div', 'detail-body', content));
      else box.appendChild(el('div', 'detail-body empty', '这条还没有正文，可能作者还在补。'));

      var foot = el('div', 'detail-foot');
      foot.appendChild(el('span', '', '悦言 · 发现所爱，分享所悦'));
      var back = el('a', 'btn', '返回列表');
      back.setAttribute('href', '/');
      back.setAttribute('data-link', '');
      foot.appendChild(back);
      box.appendChild(foot);
    });
  }

  /* ---------- 渲染入口 ---------- */
  function render(){
    var route = parseRoute();
    if (route.view === 'detail') return showDetail(route.id);
    return showHome(route);
  }

  /* ---------- 交互 ---------- */
  function submitSearch(value){
    var q = String(value || '').trim();
    var path = '/';
    navigate(path + (q ? '?q=' + encodeURIComponent(q) : ''));
  }

  $('#hdSearch').addEventListener('submit', function(e){
    e.preventDefault();
    submitSearch($('#hdInput').value);
  });

  $('#btnBack').addEventListener('click', function(){
    if (history.length > 1) history.back();
    else navigate('/');
  });

  document.addEventListener('click', function(e){
    var a = e.target.closest ? e.target.closest('a[data-link]') : null;
    if (!a) return;
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    if (a.target && a.target !== '_self') return;
    var url = a.getAttribute('href');
    if (!url || url.charAt(0) !== '/') return;
    e.preventDefault();
    navigate(url);
  });

  document.querySelector('.tabbar').addEventListener('click', function(e){
    var btn = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!btn) return;
    var act = btn.getAttribute('data-act');
    if (act === 'cats') {
      if (parseRoute().view === 'detail') navigate('/');
      else {
        var t = document.getElementById('explore');
        if (t) window.scrollTo({ top: t.offsetTop - 80, behavior: 'smooth' });
      }
    } else if (act === 'search') {
      if (parseRoute().view === 'detail') navigate('/');
      setTimeout(function(){
        var inp = $('#hdInput');
        if (inp) { inp.focus(); inp.select(); }
      }, 80);
    } else if (act === 'top') {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  });

  window.addEventListener('popstate', render);

  render();
})();
</script>
</body>
</html>
