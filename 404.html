<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF7F0">
<title>悦言 · 发现所爱，分享所悦</title>
<meta name="description" content="悦言 —— 发现所爱，分享所悦。一个安静的内容小站，收集顺手的工具、看得进去的文章和值得收藏的角落。">
<style>
:root{
  --cream:#FBF7F0;
  --cream-2:#F4ECE2;
  --sky:#CFE7FA;
  --sky-deep:#8FC4E8;
  --lilac:#E4D9F8;
  --lilac-deep:#B49BE6;
  --peach:#FBE0D5;
  --mint:#D8EFE7;
  --rose:#F8DDE4;
  --ink:#4B4257;
  --ink-2:#847B92;
  --line:rgba(120,105,150,.14);
  --card:#FFFFFF;
  --shadow:0 12px 34px rgba(120,105,150,.10);
  --shadow-sm:0 4px 14px rgba(120,105,150,.08);
  --radius:20px;
  --radius-sm:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
  color:var(--ink);
  background:
    radial-gradient(1100px 560px at 8% -12%, #EAF3FD 0%, rgba(234,243,253,0) 62%),
    radial-gradient(900px 520px at 102% -4%, #F1EAFB 0%, rgba(241,234,251,0) 58%),
    linear-gradient(180deg,#FDFBF7 0%,#F7F9FD 46%,#F9F5FD 100%);
  background-attachment:fixed;
  min-height:100vh;
  line-height:1.68;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(78px + env(safe-area-inset-bottom));
  overflow-x:hidden;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
img{max-width:100%}

/* ---------- 背景装饰 ---------- */
.deco{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.deco i{position:absolute;display:block;border-radius:50%;filter:blur(34px);opacity:.5}
.deco .b1{width:260px;height:260px;left:-80px;top:8%;background:#CFE7FA}
.deco .b2{width:220px;height:220px;right:-70px;top:26%;background:#E4D9F8}
.deco .b3{width:200px;height:200px;left:52%;top:62%;background:#FBE0D5;opacity:.36}
.deco .spark{width:3px;height:3px;border-radius:50%;background:#C9B7EC;filter:none;opacity:.8;animation:twinkle 4.5s ease-in-out infinite}
.deco .spark:nth-child(5){left:16%;top:22%;animation-delay:.4s}
.deco .spark:nth-child(6){left:78%;top:14%;animation-delay:1.6s;background:#A9CFEE}
.deco .spark:nth-child(7){left:36%;top:48%;animation-delay:2.4s}
.deco .spark:nth-child(8){left:86%;top:58%;animation-delay:1.1s;background:#EFC7B4}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.8)}50%{opacity:.9;transform:scale(1.3)}}

/* ---------- 通用布局 ---------- */
.wrap{position:relative;z-index:1;width:100%;max-width:1080px;margin:0 auto;padding:0 18px}
.view[hidden]{display:none!important}

/* ---------- 顶栏 ---------- */
.site-header{position:sticky;top:0;z-index:20;background:rgba(253,251,247,.78);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.hd-in{display:flex;align-items:center;gap:12px;height:63px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:0 0 auto}
.brand-mark{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;font-size:19px;font-weight:800;color:#fff;background:linear-gradient(135deg,#9CCBEC,#B79EEB);box-shadow:0 6px 16px rgba(150,130,210,.28);letter-spacing:0}
.brand-text{display:flex;flex-direction:column;line-height:1.2}
.brand-text b{font-size:17px;letter-spacing:1.5px}
.brand-text small{font-size:11px;color:var(--ink-2);letter-spacing:.6px;margin-top:2px}
.hd-search{position:relative;flex:1 1 auto;min-width:0;max-width:360px;margin-left:auto}
.hd-search input{width:100%;height:38px;padding:0 40px 0 14px;border-radius:19px;border:1px solid var(--line);background:rgba(255,255,255,.9);color:var(--ink);font-size:13.5px;outline:none;transition:.2s}
.hd-search input::placeholder{color:#B0A8BC}
.hd-search input:focus{border-color:#C6B4EC;box-shadow:0 0 0 4px rgba(180,155,230,.16);background:#fff}
.hd-search button{position:absolute;right:4px;top:4px;width:30px;height:30px;border-radius:50%;border:0;background:linear-gradient(135deg,#9CCBEC,#B79EEB);color:#fff;display:grid;place-items:center;cursor:pointer}
.hd-search .ico{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
@media(max-width:420px){.brand-text small{display:none}}

/* ---------- 主视觉 ---------- */
.hero{position:relative;margin:20px 0 8px;padding:30px 22px 26px;border-radius:26px;overflow:hidden;
  background:linear-gradient(140deg,#FFF8F0 0%,#EAF3FD 42%,#F0E9FB 100%);
  border:1px solid rgba(255,255,255,.75);box-shadow:var(--shadow)}
.hero-art{position:absolute;inset:0;pointer-events:none}
.hero-art .moon{position:absolute;right:26px;top:22px;width:88px;height:88px;border-radius:50%;
  background:radial-gradient(circle at 34% 32%,#FFFDF6,#FCEACF 62%,#F3DDBB);
  box-shadow:0 0 0 12px rgba(255,250,238,.55),0 0 40px rgba(240,214,170,.55)}
.hero-art .cloud{position:absolute;background:rgba(255,255,255,.85);border-radius:999px;filter:blur(.3px)}
.hero-art .c1{width:96px;height:22px;right:70px;top:104px;opacity:.9}
.hero-art .c2{width:62px;height:16px;right:22px;top:126px;opacity:.7}
.hero-art .star{position:absolute;width:5px;height:5px;background:#EADFCB;border-radius:50%;box-shadow:0 0 8px rgba(230,210,170,.9)}
.hero-art .st1{left:24%;top:26%}
.hero-art .st2{left:44%;top:14%;width:3px;height:3px}
.hero-art .st3{left:62%;top:34%;width:4px;height:4px}
.hero-art .arc{position:absolute;left:-40px;bottom:-70px;width:220px;height:220px;border-radius:50%;border:1px solid rgba(150,180,220,.35)}
.hero-kicker{position:relative;margin:0 0 10px;font-size:11px;letter-spacing:3px;color:#A294B6;font-weight:600}
.hero h1{position:relative;margin:0 0 12px;font-size:clamp(27px,7.4vw,40px);line-height:1.28;letter-spacing:2px;font-weight:800;
  background:linear-gradient(120deg,#6C5F93 0%,#7FA9CD 52%,#A88BD8 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-sub{position:relative;margin:0 0 20px;max-width:26em;font-size:13.5px;color:#7E7590;letter-spacing:.3px}
.hero-search{position:relative;display:flex;gap:8px;max-width:440px}
.hero-search input{flex:1;min-width:0;height:46px;padding:0 18px;border-radius:23px;border:1px solid rgba(255,255,255,.9);background:rgba(255,255,255,.92);box-shadow:var(--shadow-sm);font-size:14px;color:var(--ink);outline:none;transition:.2s}
.hero-search input:focus{box-shadow:0 0 0 4px rgba(180,155,230,.2)}
.hero-search button{height:46px;padding:0 22px;border-radius:23px;border:0;cursor:pointer;color:#fff;font-size:14px;font-weight:600;letter-spacing:1px;background:linear-gradient(135deg,#8FBFE6,#AE94E6);box-shadow:0 8px 20px rgba(150,130,210,.26)}
.hero-search button:active{transform:translateY(1px)}

/* ---------- 分类 ---------- */
.cat-head{display:flex;align-items:baseline;gap:8px;margin:24px 2px 10px}
.cat-head h2{margin:0;font-size:14.5px;letter-spacing:1.2px;font-weight:700;color:#5E5570}
.cat-head span{font-size:11.5px;color:var(--ink-2)}
.cats{display:flex;gap:9px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.cats::-webkit-scrollbar{display:none}
.cat-pill{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:999px;font-size:13px;color:#6E6482;background:rgba(255,255,255,.86);border:1px solid var(--line);box-shadow:var(--shadow-sm);transition:.2s;white-space:nowrap}
.cat-pill:hover{transform:translateY(-1px);color:#5A4F72}
.cat-pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.5}
.cat-pill.is-on{color:#fff;border-color:transparent;background:linear-gradient(135deg,#8FBFE6,#AE94E6);box-shadow:0 8px 18px rgba(150,130,210,.26)}
.cat-pill.is-on .dot{opacity:.85;background:#fff}

/* ---------- 列表区 ---------- */
.list-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:26px 2px 12px}
.list-head h2{margin:0;font-size:17px;letter-spacing:.6px;font-weight:700}
.list-head .meta{font-size:12px;color:var(--ink-2);white-space:nowrap}
.cards{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:600px){.cards{grid-template-columns:repeat(2,1fr);gap:16px}}
@media(min-width:900px){.cards{grid-template-columns:repeat(3,1fr)}}
.card{border-radius:var(--radius);background:var(--card);border:1px solid rgba(255,255,255,.9);box-shadow:var(--shadow-sm);overflow:hidden;transition:transform .22s ease,box-shadow .22s ease}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.card-link{display:block;height:100%}
.cover{position:relative;height:118px;display:grid;place-items:center;overflow:hidden}
.cover-glyph{font-size:34px;font-weight:800;color:rgba(255,255,255,.92);letter-spacing:2px;text-shadow:0 3px 10px rgba(120,110,150,.16)}
.cover:after{content:"";position:absolute;inset:0;background:radial-gradient(120px 90px at 82% 18%,rgba(255,255,255,.75),rgba(255,255,255,0) 70%)}
.cover[data-tone="sky"]{background:linear-gradient(135deg,#D6EBFA,#BBD5F2)}
.cover[data-tone="lilac"]{background:linear-gradient(135deg,#E8DEF9,#CDBCEF)}
.cover[data-tone="peach"]{background:linear-gradient(135deg,#FCE5DB,#F6CDBE)}
.cover[data-tone="mint"]{background:linear-gradient(135deg,#DCF2EA,#BFE3D6)}
.cover[data-tone="rose"]{background:linear-gradient(135deg,#FADFE6,#F1C4D1)}
.cover[data-tone="grey"]{background:linear-gradient(135deg,#EDEAF2,#DCD7E6)}
.card-body{padding:13px 15px 15px}
.card-top{display:flex;align-items:center;gap:7px;margin-bottom:7px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;font-size:11px;color:#6D6285;background:#F3EEFA;border:1px solid rgba(160,140,200,.14)}
.pin{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:999px;font-size:11px;color:#9A7A3E;background:linear-gradient(135deg,#FDF3DE,#F8E6C6);border:1px solid rgba(220,190,130,.3)}
.card-title{margin:0 0 6px;font-size:15px;line-height:1.5;font-weight:700;letter-spacing:.2px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-sum{margin:0 0 11px;font-size:12.5px;color:var(--ink-2);line-height:1.66;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.card-foot{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;color:#A79FBA;border-top:1px dashed var(--line);padding-top:9px}
.card-foot .go{color:#8C79C9}

/* ---------- 骨架 / 状态 ---------- */
.skel{border-radius:12px;background:linear-gradient(100deg,#F1EDF6 30%,#FAF8FD 50%,#F1EDF6 70%);background-size:220% 100%;animation:shimmer 1.5s linear infinite}
@keyframes shimmer{0%{background-position:120% 0}100%{background-position:-60% 0}}
.sk-card{border-radius:var(--radius);background:var(--card);border:1px solid rgba(255,255,255,.9);box-shadow:var(--shadow-sm);overflow:hidden}
.sk-card .sk-cover{height:118px;border-radius:0}
.sk-card .sk-body{padding:14px 15px 16px;display:flex;flex-direction:column;gap:9px}
.sk-line{height:12px}
.sk-line.w70{width:70%}
.sk-line.w40{width:40%}
.state{padding:38px 20px;text-align:center;border-radius:var(--radius);background:rgba(255,255,255,.72);border:1px dashed rgba(150,135,180,.26);margin:4px 0}
.state .emo{font-size:26px;line-height:1;margin-bottom:10px;opacity:.85}
.state h3{margin:0 0 6px;font-size:15px;letter-spacing:.4px}
.state p{margin:0 auto;max-width:24em;font-size:12.8px;color:var(--ink-2);line-height:1.7}
.state .acts{margin-top:16px;display:flex;gap:9px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 18px;border-radius:19px;border:1px solid var(--line);background:#fff;color:#655A7C;font-size:13px;cursor:pointer;transition:.2s}
.btn:hover{border-color:#C9BAE8}
.btn-primary{border:0;color:#fff;background:linear-gradient(135deg,#8FBFE6,#AE94E6);box-shadow:0 8px 18px rgba(150,130,210,.24)}
.btn:active{transform:translateY(1px)}

/* ---------- 分页 ---------- */
.pager{display:flex;align-items:center;justify-content:center;gap:8px;margin:24px 0 6px;flex-wrap:wrap}
.pager .pg{min-width:38px;height:38px;padding:0 14px;border-radius:19px;border:1px solid var(--line);background:rgba(255,255,255,.9);color:#6C6180;font-size:13px;display:inline-flex;align-items:center;justify-content:center;transition:.2s}
.pager .pg:hover{border-color:#C9BAE8;color:#5A4F72}
.pager .pg.is-now{color:#fff;border-color:transparent;background:linear-gradient(135deg,#8FBFE6,#AE94E6);box-shadow:0 8px 18px rgba(150,130,210,.24)}
.pager .pg.is-off{opacity:.42;pointer-events:none}
.pager .gap{color:#B8AFC8;font-size:12px;padding:0 2px}

/* ---------- 详情 ---------- */
.detail-wrap{padding:18px 0 10px}
.back-btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:17px;border:1px solid var(--line);background:rgba(255,255,255,.9);color:#6C6180;font-size:12.5px;cursor:pointer;margin-bottom:14px}
.back-btn:hover{border-color:#C9BAE8}
.detail-card{position:relative;border-radius:24px;background:rgba(255,255,255,.94);border:1px solid rgba(255,255,255,.95);box-shadow:var(--shadow);padding:24px 20px 28px;overflow:hidden}
.detail-card:before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(90deg,#A9CFEE,#B79EEB,#F0C9BC)}
.detail-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.detail-title{margin:0 0 12px;font-size:clamp(20px,5.4vw,26px);line-height:1.48;letter-spacing:.4px;font-weight:800}
.detail-meta{display:flex;align-items:center;gap:14px;font-size:12px;color:var(--ink-2);padding-bottom:16px;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.detail-summary{margin:18px 0 0;padding:14px 16px;border-radius:var(--radius-sm);background:linear-gradient(135deg,#F8F5FD,#F4F9FD);color:#6E6484;font-size:13.2px;line-height:1.8;border:1px solid rgba(160,145,200,.13)}
.detail-body{margin:22px 0 0;font-size:15px;line-height:1.95;color:#504860;letter-spacing:.2px;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere}
.detail-body.empty{color:#A9A0B8;font-size:13.5px}
.detail-foot{margin-top:26px;padding-top:16px;border-top:1px dashed var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:#A79FBA}
.detail-skel{display:flex;flex-direction:column;gap:12px;padding:6px 0 10px}
.detail-skel .sk-line{height:14px}
.detail-skel .sk-title{height:26px;width:72%}
.detail-skel .sk-block{height:120px;border-radius:var(--radius-sm)}

/* ---------- 页脚 ---------- */
.site-footer{margin-top:44px;padding:26px 0 26px;border-top:1px solid var(--line);text-align:center}
.foot-brand{font-size:15px;font-weight:800;letter-spacing:3px;color:#695E82}
.foot-slogan{margin:6px 0 10px;font-size:11.5px;letter-spacing:2px;color:#A79FBA}
.foot-note{margin:0 0 4px;font-size:12px;color:var(--ink-2)}
.foot-copy{margin:0;font-size:11px;color:#B7AFC6}

/* ---------- 底部导航 ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
  background:rgba(255,255,255,.88);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(120,105,150,.08);
  padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tabbar a,.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 0;background:none;border:0;color:#9E96AF;font-size:10.5px;letter-spacing:.5px;cursor:pointer;border-radius:12px;transition:.18s}
.tabbar .ico{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabbar .is-on{color:#7A66B8}
.tabbar a:active,.tabbar button:active{background:rgba(180,155,230,.1)}
@media(min-width:760px){.tabbar{display:none}body{padding-bottom:44px}}
</style>
</head>
<body>

<div class="deco" aria-hidden="true">
  <i class="b1"></i><i class="b2"></i><i class="b3"></i>
  <i class="spark"></i><i class="spark"></i><i class="spark"></i><i class="spark"></i>
</div>

<header class="site-header">
  <div class="wrap hd-in">
    <a class="brand" href="/" data-link>
      <span class="brand-mark" aria-hidden="true">悦</span>
      <span class="brand-text"><b>悦言</b><small>发现所爱，分享所悦</small></span>
    </a>
    <form class="hd-search" id="hdSearch" role="search">
      <input id="hdInput" type="search" placeholder="搜标题、摘要…" autocomplete="off" aria-label="站内搜索">
      <button type="submit" aria-label="搜索">
        <svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.6-3.6"></path></svg>
      </button>
    </form>
  </div>
</header>

<main class="wrap">

  <!-- ============ 首页 ============ -->
  <section id="viewHome" class="view">
    <section class="hero">
      <div class="hero-art" aria-hidden="true">
        <span class="moon"></span>
        <span class="cloud c1"></span><span class="cloud c2"></span>
        <span class="star st1"></span><span class="star st2"></span><span class="star st3"></span>
        <span class="arc"></span>
      </div>
      <p class="hero-kicker">YUEYAN · 内容小站</p>
      <h1>发现所爱<br>分享所悦</h1>
      <p class="hero-sub">顺手的工具、看得进去的文章、值得收藏的角落，都慢慢攒在这里。</p>
      <form class="hero-search" id="heroSearch" role="search">
        <input id="heroInput" type="search" placeholder="想看点什么？搜标题或摘要…" autocomplete="off" aria-label="站内搜索">
        <button type="submit">搜索</button>
      </form>
    </section>

    <div class="cat-head">
      <h2>分类</h2>
      <span>点一个看看</span>
    </div>
    <nav class="cats" id="catNav" aria-label="内容分类"></nav>

    <div class="list-head">
      <h2 id="listTitle">最新内容</h2>
      <span class="meta" id="listMeta"></span>

    <div id="listArea">
      <div class="cards" id="cards"></div>
      <div id="listState"></div>
    </div>

    <nav class="pager" id="pager" aria-label="分页"></nav>
  </section>

  <!-- ============ 详情 ============ -->
  <section id="viewDetail" class="view" hidden>
    <div class="detail-wrap">
      <button class="back-btn" id="btnBack" type="button">
        <svg class="ico" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
        返回列表
      </button>
      <article class="detail-card" id="detailBody"></article>
    </div>
  </section>

  <footer class="site-footer">
    <div class="foot-brand">悦言</div>
    <p class="foot-slogan">发现所爱，分享所悦</p>
    <p class="foot-note">这个站还在慢慢搭建，内容会一条条补上</p>
    <p class="foot-copy">© 2026 悦言</p>
  </footer>
</main>

<nav class="tabbar" aria-label="底部导航">
  <a href="/" data-link data-tab="home">
    <svg class="ico" viewBox="0 0 24 24"><path d="M3 10.6 12 3l9 7.6"></path><path d="M5.5 9.6V21h13V9.6"></path></svg>
    <span>首页</span>
  </a>
  <button type="button" data-act="cats">
    <svg class="ico" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="2"></rect><rect x="13.5" y="3.5" width="7" height="7" rx="2"></rect><rect x="3.5" y="13.5" width="7" height="7" rx="2"></rect><rect x="13.5" y="13.5" width="7" height="7" rx="2"></rect></svg>
    <span>分类</span>
  </button>
  <button type="button" data-act="search">
    <svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.6-3.6"></path></svg>
    <span>搜索</span>
  </button>
  <button type="button" data-act="top">
    <svg class="ico" viewBox="0 0 24 24"><path d="M12 20V5"></path><path d="M6 11l6-6 6 6"></path></svg>
    <span>回顶部</span>
  </button>
</nav>

<script>
(function(){
  'use strict';

  var PAGE_SIZE = 12;
  var TONE = { '文章':'sky', '实用工具':'mint', '资源分享':'peach', '教程指南':'lilac', '其他':'grey' };

  var state = { cats: null, catsFailed: false, reqId: 0 };

  var $ = function(sel){ return document.querySelector(sel); };

  function el(tag, cls, text){
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = String(text);
    return n;
  }

  function clear(node){ while (node.firstChild) node.removeChild(node.firstChild); }

  function fmtDate(raw){
    if (!raw) return '';
    var s = String(raw);
    var m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m) return m[1] + '.' + m[2] + '.' + m[3];
    return s.slice(0, 10);
  }

  function toneOf(cat){
    return TONE[cat] || 'grey';
  }

  function glyphOf(cat){
    var s = (cat || '悦').trim();
    return s ? s.slice(0, 1) : '悦';
  }

  /* ---------------- 请求层 ---------------- */

  /* ---- 静态化数据层：把 /api/* 映射到本地 data.json ---- */
  var __statDb = null;
  function __loadDb(){
    if (__statDb) return Promise.resolve(__statDb);
    return fetch('/data.json', { cache: 'no-store' })
      .then(function(r){ return r.json(); })
      .then(function(j){ __statDb = j || {}; return __statDb; })
      .catch(function(){ __statDb = { categories: [], contents: [] }; return __statDb; });
  }
  function staticApi(path){
    return __loadDb().then(function(db){
      var cats = Array.isArray(db.categories) ? db.categories : [];
      var items = Array.isArray(db.contents) ? db.contents : [];
      var qs = '';
      var p = String(path || '');
      var qi = p.indexOf('?');
      if (qi >= 0) { qs = p.slice(qi + 1); p = p.slice(0, qi); }
      if (p === '/api/categories') {
        return { ok: true, status: 200, data: cats };
      }
      if (p.indexOf('/api/contents/') === 0) {
        var id = p.slice('/api/contents/'.length);
        var one = null;
        for (var i = 0; i < items.length; i++) {
          if (String(items[i].id) === String(id)) { one = items[i]; break; }
        }
        if (!one) return { ok: false, status: 404 };
        return { ok: true, status: 200, data: { item: one } };
      }
      if (p === '/api/contents') {
        var q = new URLSearchParams(qs);
        var page = parseInt(q.get('page') || '1', 10); if (!(page > 0)) page = 1;
        var size = parseInt(q.get('page_size') || '12', 10); if (!(size > 0)) size = 12;
        var cat = q.get('category');
        var list = items.filter(function(x){ return !cat || x.category === cat; });
        var total = list.length;
        var start = (page - 1) * size;
        return { ok: true, status: 200, data: {
          items: list.slice(start, start + size),
          total: total,
          page: page,
          page_size: size
        } };
      }
      return { ok: false, status: 404 };
    });
  }
  function api(path){
    return staticApi(path);
    var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    var timer = setTimeout(function(){ if (ctrl) ctrl.abort(); }, 10000);
    return fetch(path, {
      headers: { 'Accept': 'application/json' },
      cache: 'no-store',
      signal: ctrl ? ctrl.signal : undefined
    }).then(function(res){
      if (res.status === 404) return { ok: false, status: 404 };
      if (!res.ok) return { ok: false, status: res.status };
      return res.json().then(function(data){
        return { ok: true, status: res.status, data: data };
      });
    }).catch(function(){
      return { ok: false, status: 0 };
    }).then(function(r){
      clearTimeout(timer);
      return r;
    });
  }

  /* ---------------- 路由 ---------------- */
  function parseRoute(){
    var path = location.pathname.replace(/\/+$/, '') || '/';
    var sp = new URLSearchParams(location.search);
    var q = (sp.get('q') || '').trim();
    var page = parseInt(sp.get('page') || '1', 10);
    if (!(page > 0)) page = 1;

    var m = path.match(/^\/content\/(\d+)$/);
    if (m) return { view: 'detail', id: parseInt(m[1], 10) };

    m = path.match(/^\/category\/(.+)$/);
    if (m) {
      var cat = '';
      try { cat = decodeURIComponent(m[1]); } catch (e) { cat = m[1]; }
      return { view: 'home', category: cat, q: q, page: page };
    }
    return { view: 'home', category: '', q: q, page: page };
  }

  function hrefWithPage(page){
    var sp = new URLSearchParams(location.search);
    if (page > 1) sp.set('page', String(page)); else sp.delete('page');
    var qs = sp.toString();
    return location.pathname + (qs ? '?' + qs : '');
  }

  function navigate(to, replace){
    var now = location.pathname + location.search;
    if (to === now) { render(); return; }
    if (replace) history.replaceState({}, '', to);
    else history.pushState({}, '', to);
    render();
    window.scrollTo({ top: 0, behavior: 'auto' });
  }

  document.addEventListener('click', function(e){
    var a = e.target.closest ? e.target.closest('a[data-link]') : null;
    if (!a) return;
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    var url;
    try { url = new URL(a.getAttribute('href'), location.origin); } catch (err) { return; }
    if (url.origin !== location.origin) return;
    e.preventDefault();
    navigate(url.pathname + url.search);
  });

  window.addEventListener('popstate', render);

  /* ---------------- 分类 ---------------- */
  function ensureCats(){
    if (state.cats) return Promise.resolve(state.cats);
    return api('/api/categories').then(function(res){
      if (res.ok && Array.isArray(res.data)) {
        state.cats = res.data;
      } else {
        state.cats = [];
        state.catsFailed = true;
      }
      return state.cats;
    });
  }

  function renderCatNav(active){
    var nav = $('#catNav');
    clear(nav);
    if (state.catsFailed) {
      nav.appendChild(el('span', 'cat-pill', '分类没加载出来'));
      return;
    }
    var all = el('a', 'cat-pill' + (active ? '' : ' is-on'), '');
    all.setAttribute('href', '/');
    all.setAttribute('data-link', '');
    all.appendChild(el('span', 'dot'));
    all.appendChild(document.createTextNode('全部'));
    nav.appendChild(all);

    (state.cats || []).forEach(function(c){
      var name = String(c && c.name ? c.name : '');
      if (!name) return;
      var a = el('a', 'cat-pill' + (active === name ? ' is-on' : ''), '');
      a.setAttribute('href', '/category/' + encodeURIComponent(name));
      a.setAttribute('data-link', '');
      a.appendChild(el('span', 'dot'));
      a.appendChild(document.createTextNode(name));
      nav.appendChild(a);
    });
  }

  /* ---------------- 卡片 ---------------- */
  function cardEl(item){
    var cat = item && item.category ? String(item.category) : '';
    var tone = toneOf(cat);

    var a = el('a', 'card-link');
    a.setAttribute('href', '/content/' + String(item && item.id != null ? item.id : ''));
    a.setAttribute('data-link', '');

    var cover = el('div', 'cover');
    cover.setAttribute('data-tone', tone);
    cover.appendChild(el('span', 'cover-glyph', glyphOf(cat)));
    a.appendChild(cover);

    var body = el('div', 'card-body');
    var top = el('div', 'card-top');
    if (cat) top.appendChild(el('span', 'chip', cat));
    if (item && (item.is_pinned === 1 || item.is_pinned === true)) top.appendChild(el('span', 'pin', '置顶'));
    body.appendChild(top);

    body.appendChild(el('h3', 'card-title', (item && item.title) ? item.title : '无标题'));
    body.appendChild(el('p', 'card-sum', (item && item.summary) ? item.summary : '（这条还没有摘要）'));

    var foot = el('div', 'card-foot');
    foot.appendChild(el('time', '', fmtDate(item && item.created_at)));
    foot.appendChild(el('span', 'go', '阅读 →'));
    body.appendChild(foot);

    a.appendChild(body);

    var wrapCard = el('article', 'card');
    wrapCard.appendChild(a);
    return wrapCard;
  }

  function renderCards(items){
    var box = $('#cards');
    clear(box);
    items.forEach(function(it){ box.appendChild(cardEl(it)); });
  }

  /* ---------------- 状态块 ---------------- */
  function showState(kind, extra){
    var host = $('#listState');
    clear(host);
    var box = el('div', 'state');
    var emo = el('div', 'emo');
    var h3 = el('h3');
    var p = el('p');
    var acts = el('div', 'acts');

    if (kind === 'loading') {
      host.appendChild(buildSkeleton());
      return;
    }
    if (kind === 'empty') {
      emo.textContent = '🌙';
      h3.textContent = '这里还空着';
      p.textContent = '内容还在慢慢往这儿搬，过阵子再来看看。';
      var b1 = el('button', 'btn btn-primary', '刷新看看');
      b1.type = 'button';
      b1.addEventListener('click', function(){ render(); });
      acts.appendChild(b1);
    } else if (kind === 'empty-page') {
      emo.textContent = '🍃';
      h3.textContent = '这一页没有内容';
      p.textContent = '页码可能翻过头了，回第一页看看吧。';
      var b2 = el('a', 'btn btn-primary', '回第一页');
      b2.setAttribute('href', hrefWithPage(1));
      b2.setAttribute('data-link', '');
      acts.appendChild(b2);
    } else if (kind === 'noresult') {
      emo.textContent = '🔍';
      h3.textContent = '没找到相符的内容';
      p.textContent = '换个词试试，或者从分类里逛逛。';
      var b3 = el('a', 'btn', '看全部内容');
      b3.setAttribute('href', '/');
      b3.setAttribute('data-link', '');
      acts.appendChild(b3);
    } else if (kind === 'error') {
      emo.textContent = '☁️';
      h3.textContent = '内容没能加载出来';
      p.textContent = extra === 404 ? '接口没有回应（404）。' : (extra ? '网络或服务出了点状况（' + extra + '）。' : '网络好像断了，检查一下连接。');
      var b4 = el('button', 'btn btn-primary', '再试一次');
      b4.type = 'button';
      b4.addEventListener('click', function(){ render(); });
      acts.appendChild(b4);
    } else {
      return;
    }
    box.appendChild(emo);
    box.appendChild(h3);
    box.appendChild(p);
    box.appendChild(acts);
    host.appendChild(box);
  }

  function clearState(){
    clear($('#listState'));
  }

  function buildSkeleton(){
    var frag = document.createDocumentFragment();
    var grid = el('div', 'cards');
    for (var i = 0; i < 3; i++) {
      var c = el('div', 'sk-card');
      c.appendChild(el('div', 'sk-cover skel'));
      var b = el('div', 'sk-body');
      b.appendChild(el('div', 'sk-line w40 skel'));
      b.appendChild(el('div', 'sk-line skel'));
      b.appendChild(el('div', 'sk-line w70 skel'));
      c.appendChild(b);
      grid.appendChild(c);
    }
    frag.appendChild(grid);
    return frag;
  }

  /* ---------------- 分页 ---------------- */
  function renderPager(info){
    var host = $('#pager');
    clear(host);
    var total = Number(info && info.total) || 0;
    var pageSize = Number(info && info.page_size) || PAGE_SIZE;
    var page = Number(info && info.page) || 1;
    var pages = Math.max(1, Math.ceil(total / pageSize));
    if (pages <= 1) return;

    var mk = function(label, target, extraCls){
      var a = el('a', 'pg' + (extraCls ? ' ' + extraCls : ''), label);
      a.setAttribute('href', hrefWithPage(target));
      a.setAttribute('data-link', '');
      return a;
    };

    host.appendChild(page > 1 ? mk('上一页', page - 1) : mk('上一页', page, 'is-off'));

    var list = [];
    if (pages <= 7) {
      for (var i = 1; i <= pages; i++) list.push(i);
    } else {
      list = [1];
      if (page > 3) list.push('…');
      for (var j = Math.max(2, page - 1); j <= Math.min(pages - 1, page + 1); j++) list.push(j);
      if (page < pages - 2) list.push('…');
      list.push(pages);
    }

    list.forEach(function(n){
      if (n === '…') { host.appendChild(el('span', 'gap', '…')); return; }
      host.appendChild(mk(String(n), n, n === page ? 'is-now' : ''));
    });

    host.appendChild(page < pages ? mk('下一页', page + 1) : mk('下一页', page, 'is-off'));
  }

  /* ---------------- 列表加载 ---------------- */
  function listUrl(page, category){
    var u = '/api/contents?page=' + page + '&page_size=' + PAGE_SIZE;
    if (category) u += '&category=' + encodeURIComponent(category);
    return u;
  }

  function loadList(route){
    var id = ++state.reqId;
    clear($('#cards'));
    clear($('#pager'));
    showState('loading');

    return api(listUrl(route.page, route.category)).then(function(res){
      if (id !== state.reqId) return;
      if (!res.ok) { showState('error', res.status); $('#listMeta').textContent = ''; return; }
      var d = res.data || {};
      var items = Array.isArray(d.items) ? d.items : [];
      var total = Number(d.total) || 0;
      $('#listMeta').textContent = total ? '共 ' + total + ' 条' : '';
      if (!items.length) {
        showState(route.page > 1 ? 'empty-page' : 'empty');
        return;
      }
      clearState();
      renderCards(items);
      renderPager({ total: (Number(d.total) || items.length), page: (Number(d.page) || route.page), page_size: (Number(d.page_size) || PAGE_SIZE) });
    });
  }

  function fetchAllForSearch(category, id){
    var items = [];
    var page = 1;
    var size = 50;

    function step(){
      if (page > 8) return Promise.resolve({ ok: true, status: 200, items: items });
      var u = '/api/contents?page=' + page + '&page_size=' + size;
      if (category) u += '&category=' + encodeURIComponent(category);
      return api(u).then(function(res){
        if (id !== state.reqId) return { ok: false, status: -1, items: items };
        if (!res.ok) return { ok: false, status: res.status, items: items };
        var d = res.data || {};
        var got = Array.isArray(d.items) ? d.items : [];
        items = items.concat(got);
        var total = Number(d.total) || 0;
        if (!got.length || items.length >= total || got.length < size) {
          return { ok: true, status: 200, items: items };
        }
        page++;
        return step();
      });
    }
    return step();
  }

  function runSearch(route){
    var id = ++state.reqId;
    clear($('#cards'));
    clear($('#pager'));
    showState('loading');

    return fetchAllForSearch(route.category, id).then(function(res){
      if (id !== state.reqId) return;
      if (!res.ok) { showState('error', res.status); return; }
      var kw = route.q.toLowerCase();
      var hit = res.items.filter(function(it){
        var text = String((it && it.title) || '') + ' ' + String((it && it.summary) || '');
        return text.toLowerCase().indexOf(kw) !== -1;
      });
      $('#listMeta').textContent = hit.length ? '找到 ' + hit.length + ' 条' : '';
      if (!hit.length) { showState('noresult'); return; }
      clearState();
      var pages = Math.max(1, Math.ceil(hit.length / PAGE_SIZE));
      var page = Math.min(route.page, pages);
      var slice = hit.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE);
      renderCards(slice);
      renderPager({ total: hit.length, page: page, page_size: PAGE_SIZE });
    });
  }

  /* ---------------- 首页 ---------------- */
  function syncSearchInputs(q){
    var a = $('#hdInput');
    var b = $('#heroInput');
    if (a && a.value !== q) a.value = q;
    if (b && b.value !== q) b.value = q;
  }

  function syncTab(which){
    var nodes = document.querySelectorAll('.tabbar [data-tab], .tabbar [data-act]');
    for (var i = 0; i < nodes.length; i++) {
      var n = nodes[i];
      var key = n.getAttribute('data-tab') || ('act:' + n.getAttribute('data-act'));
      n.classList.toggle('is-on', key === which);
    }
  }

  function showHome(route){
    $('#viewHome').hidden = false;
    $('#viewDetail').hidden = true;
    syncSearchInputs(route.q);

    return ensureCats().then(function(){
      renderCatNav(route.category);

      var title;
      if (route.q) title = '搜索：' + route.q;
      else if (route.category) title = route.category;
      else title = '最新内容';
      $('#listTitle').textContent = title;
      document.title = route.q ? (route.q + ' · 悦言') : (route.category ? (route.category + ' · 悦言') : '悦言 · 发现所爱，分享所悦');

      syncTab(route.q ? 'act:search' : 'home');

      if (route.q) return runSearch(route);
      return loadList(route);
    });
  }

  /* ---------------- 详情 ---------------- */
  function detailSkeleton(){
    var box = el('div', 'detail-skel');
    box.appendChild(el('div', 'sk-title skel'));
    box.appendChild(el('div', 'sk-line w40 skel'));
    box.appendChild(el('div', 'sk-block skel'));
    box.appendChild(el('div', 'sk-line skel'));
    box.appendChild(el('div', 'sk-line w70 skel'));
    return box;
  }

  function showDetail(id){
    $('#viewHome').hidden = true;
    $('#viewDetail').hidden = false;
    syncTab('');
    var box = $('#detailBody');
    clear(box);
    box.appendChild(detailSkeleton());

    return api('/api/contents/' + id).then(function(res){
      clear(box);

      if (!res.ok && res.status === 404) {
        document.title = '内容不存在 · 悦言';
        box.appendChild(el('div', 'detail-top'));
        var t = el('h1', 'detail-title', '这条内容不在了');
        box.appendChild(t);
        var state404 = el('div', 'state');
        state404.appendChild(el('div', 'emo', '🍂'));
        state404.appendChild(el('h3', '', '可能还没发布，或者链接写错了'));
        var p404 = el('p', '', '换个地方逛逛吧，首页里还有别的东西。');
        state404.appendChild(p404);
        var acts = el('div', 'acts');
        var b1 = el('a', 'btn btn-primary', '回到首页');
        b1.setAttribute('href', '/');
        b1.setAttribute('data-link', '');
        acts.appendChild(b1);
        state404.appendChild(acts);
        box.appendChild(state404);
        return;
      }

      if (!res.ok) {
        document.title = '加载失败 · 悦言';
        box.appendChild(el('h1', 'detail-title', '内容没能加载出来'));
        var st = el('div', 'state');
        st.appendChild(el('div', 'emo', '☁️'));
        st.appendChild(el('h3', '', '网络或服务出了点状况'));
        st.appendChild(el('p', '', res.status ? ('错误码 ' + res.status) : '网络好像断了。'));
        var acts2 = el('div', 'acts');
        var b2 = el('button', 'btn btn-primary', '再试一次');
        b2.type = 'button';
        b2.addEventListener('click', function(){ showDetail(id); });
        acts2.appendChild(b2);
        var b3 = el('a', 'btn', '回首页');
        b3.setAttribute('href', '/');
        b3.setAttribute('data-link', '');
        acts2.appendChild(b3);
        st.appendChild(acts2);
        box.appendChild(st);
        return;
      }

      var d = res.data || {};
      var it = (d.item && typeof d.item === 'object') ? d.item : ((d.data && typeof d.data === 'object') ? d.data : d);
      var cat = it && it.category ? String(it.category) : '';
      var pinned = it && (it.is_pinned === 1 || it.is_pinned === true);

      document.title = ((it && it.title) ? it.title : '内容') + ' · 悦言';

      var top = el('div', 'detail-top');
      if (cat) top.appendChild(el('span', 'chip', cat));
      if (pinned) top.appendChild(el('span', 'pin', '置顶'));
      box.appendChild(top);

      box.appendChild(el('h1', 'detail-title', (it && it.title) ? it.title : '无标题'));

      var meta = el('div', 'detail-meta');
      meta.appendChild(el('span', '', '发布于 ' + (fmtDate(it && it.created_at) || '未知')));
      if (it && it.updated_at && fmtDate(it.updated_at) !== fmtDate(it.created_at)) {
        meta.appendChild(el('span', '', '更新于 ' + fmtDate(it.updated_at)));
      }
      box.appendChild(meta);

      if (it && it.summary) {
        var sum = el('p', 'detail-summary', it.summary);
        box.appendChild(sum);
      }

      var content = it && it.content != null ? String(it.content) : '';
      if (content.trim()) {
        box.appendChild(el('div', 'detail-body', content));
      } else {
        box.appendChild(el('div', 'detail-body empty', '这条还没有正文，可能作者还在补。'));
      }

      var foot = el('div', 'detail-foot');
      foot.appendChild(el('span', '', '悦言 · 发现所爱，分享所悦'));
      var back = el('a', 'btn', '返回列表');
      back.setAttribute('href', '/');
      back.setAttribute('data-link', '');
      foot.appendChild(back);
      box.appendChild(foot);
    });
  }

  /* ---------------- 渲染入口 ---------------- */
  function render(){
    var route = parseRoute();
    if (route.view === 'detail') return showDetail(route.id);
    return showHome(route);
  }

  /* ---------------- 交互绑定 ---------------- */
  function submitSearch(value){
    var q = String(value || '').trim();
    var path = location.pathname;
    if (/^\/content\//.test(path)) path = '/';
    if (!/^\/category\//.test(path)) path = '/';
    navigate(path + (q ? '?q=' + encodeURIComponent(q) : ''));
  }

  $('#hdSearch').addEventListener('submit', function(e){
    e.preventDefault();
    submitSearch($('#hdInput').value);
  });

  $('#heroSearch').addEventListener('submit', function(e){
    e.preventDefault();
    submitSearch($('#heroInput').value);
  });

  $('#btnBack').addEventListener('click', function(){
    if (history.length > 1) history.back();
    else navigate('/');
  });

  document.querySelector('.tabbar').addEventListener('click', function(e){
    var btn = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!btn) return;
    var act = btn.getAttribute('data-act');
    if (act === 'cats') {
      if (parseRoute().view === 'detail') { navigate('/'); }
      else { window.scrollTo({ top: 0, behavior: 'smooth' }); }
    } else if (act === 'search') {
      if (parseRoute().view === 'detail') navigate('/');
      setTimeout(function(){
        var inp = window.scrollY > 160 ? $('#hdInput') : $('#heroInput');
        if (inp) { inp.focus(); inp.select(); }
      }, 60);
    } else if (act === 'top') {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  });

  /* 开始 */
  render();
})();
</script>
</body>
</html>
